name: Add garments from photos
on:
  push:
    paths: ['inbox/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy pillow scipy rembg onnxruntime
      - run: python3 tools/process_inbox.py
      - run: bash tools/bump.sh || true
      - run: |
          git config user.name "maison-lin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A assets/custom inbox index.html js style.css
          git diff --cached --quiet || git commit -m "Add garment(s) from inbox photos"
          git push
