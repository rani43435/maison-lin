<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — Maison Lin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#EFE8DE;--card:#F8F4EE;--ink:#2E2019;--ink2:#6B5848;--line:rgba(46,32,25,.14);--accent:#A26E3F;--ok:#4D7A4A;--bad:#A0432F;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:14px;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(14px,3vw,36px);background:rgba(239,232,222,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--serif);font-size:26px;text-decoration:none}.logo em{font-style:italic}.logo small{font-family:var(--sans);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink2);margin-left:10px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{height:36px;padding:0 14px;border-radius:20px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--card)}
.wrap{max-width:1180px;margin:0 auto;padding:26px clamp(14px,3vw,36px) 80px}
h1{font-family:var(--serif);font-weight:300;font-size:40px;margin-bottom:6px}
h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:28px 0 12px}
.sub{color:var(--ink2);margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px}
.btn{height:42px;padding:0 20px;border-radius:3px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--ink);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:var(--ink);color:var(--card)}
.btn.small{height:32px;padding:0 12px;font-size:10px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
label{display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
input,select,textarea{height:42px;border:1px solid var(--line);background:#fff;border-radius:3px;padding:0 12px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
textarea{height:auto;min-height:90px;padding:10px 12px;resize:vertical}
input[type=color]{padding:2px;width:56px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.item img,.item .ph{width:64px;height:76px;object-fit:cover;border-radius:3px;background:#e4d9cb}
.item .n{font-family:var(--serif);font-size:20px;line-height:1.1}
.item .m{font-size:12px;color:var(--ink2);margin-top:3px}
.pill{display:inline-block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid var(--line)}
.pill.ready,.pill.paid{background:rgba(77,122,74,.12);color:var(--ok);border-color:transparent}
.pill.processing,.pill.pending{background:rgba(162,110,63,.14);color:var(--accent);border-color:transparent}
.pill.failed,.pill.cancelled,.pill.refunded{background:rgba(160,67,47,.12);color:var(--bad);border-color:transparent}
.pill.shipped,.pill.delivered{background:rgba(46,32,25,.08)}
.switch{position:relative;width:40px;height:22px;border-radius:20px;background:#cfc3b4;transition:.2s;flex:none}
.switch.on{background:var(--ok)}.switch::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}.switch.on::after{left:21px}
.edit{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px;margin-top:4px;display:none}
.item.open .edit{display:block}
.drop{position:relative;aspect-ratio:4/5;border:1.5px dashed rgba(46,32,25,.3);border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink2);overflow:hidden;background:#fff;cursor:pointer}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--card);padding:12px 20px;border-radius:30px;opacity:0;transition:.3s;z-index:20;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.center{min-height:80vh;display:flex;align-items:center;justify-content:center}
.login{width:min(420px,100%)}
.muted{color:var(--ink2);font-size:12.5px;line-height:1.6}
code{background:#fff;border:1px solid var(--line);padding:2px 6px;border-radius:3px;font-size:12px;word-break:break-all}
.ord{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.ord .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.ord table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
.ord td{padding:5px 0;border-bottom:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px}
.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:30px}
.stat span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
@media (max-width:760px){.grid2,.grid3,.grid4,.stats{grid-template-columns:1fr 1fr}.item{grid-template-columns:52px 1fr}.item .act{grid-column:1/-1}.logo small{display:none}h1{font-size:32px}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="./" id="logo">Maison <em>Lin</em><small>Admin</small></a>
  <nav class="tabs" id="tabs" hidden>
    <button data-tab="products" class="on">Products</button>
    <button data-tab="add">Add piece</button>
    <button data-tab="orders">Orders</button>
    <button data-tab="settings">Settings</button>
    <button data-tab="logout">Sign out</button>
  </nav>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script src="lib/supabase/supabase.js"></script>
<script type="module" src="js/admin.js?v=1794321443"></script>
</body>
</html>
